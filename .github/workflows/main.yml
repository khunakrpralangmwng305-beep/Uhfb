-- 🛡️ 2. ระบบป้องกันการแบนขั้นสูง (Advanced Bypass)
-- ==========================================
local BannedRemotes = { "ban", "kick", "log", "report", "anticheat", "detect", "flag", "crash", "telemetry" }

local function SetupAntiBan()
    if not hookmetamethod then return end
    
    local oldNamecall
    oldNamecall = hookmetamethod(game, "__namecall", newcclosure(function(self, ...)
        local method = getnamecallmethod()
        
        if States.AntiBan and not checkcaller() then
            if method == "Kick" or method == "kick" then
                return nil
            end
            
            if method == "FireServer" or method == "InvokeServer" then
                local remoteName = string.lower(self.Name)
                for _, keyword in ipairs(BannedRemotes) do
                    if string.find(remoteName, keyword) then
                        return nil
                    end
                end
            end
        end
        return oldNamecall(self, ...)
    end))
end
pcall(SetupAntiBan)

