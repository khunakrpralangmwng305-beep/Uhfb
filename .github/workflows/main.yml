-- 👁️ 6. ระบบมองทะลุ (Zero-Lag ESP)
-- ==========================================
VisualTab:CreateSection("ESP Player")

local function RemoveESP(player)
    if ESPStorage[player] then
        for _, obj in pairs(ESPStorage[player]) do
            if obj then obj:Destroy() end
        end
        ESPStorage[player] = nil
    end
end

local function CreateESP(player)
    if player == LocalPlayer then return end
    RemoveESP(player)
    
    local function Apply(character)
        if not character then return end
        local head = character:WaitForChild("Head", 5)
        if not head then return end
        
        local highlight = Instance.new("Highlight")
        highlight.Name = "ProESP_HL"
        highlight.FillColor = Color3.fromRGB(255, 50, 50)
        highlight.OutlineColor = Color3.fromRGB(255, 255, 255)
        highlight.FillTransparency = 0.5
        highlight.Parent = character

        local bgui = Instance.new("BillboardGui")
        bgui.Name = "ProESP_Txt"
        bgui.AlwaysOnTop = true
        bgui.Size = UDim2.new(0, 200, 0, 50)
        bgui.StudsOffset = Vector3.new(0, 3, 0)
        bgui.Adornee = head
        
        local label = Instance.new("TextLabel")
        label.Size = UDim2.new(1, 0, 1, 0)
        label.BackgroundTransparency = 1
        label.TextColor3 = Color3.fromRGB(255, 255, 255)
        label.TextStrokeTransparency = 0
        label.Font = Enum.Font.GothamBold
        label.TextSize = 13
        label.Parent = bgui
        bgui.Parent = character

        ESPStorage[player] = {highlight, bgui}
    end

    if player.Character then Apply(player.Character) end
    player.CharacterAdded:Connect(Apply)
end

VisualTab:CreateToggle({
    Name = "🔴 เปิดมองทะลุผู้เล่น + บอกระยะทาง",
    CurrentValue = false,
    Flag = "PlayerESP",
    Callback = function(Value)
        States.ESP = Value
        if Value then
            for _, p in pairs(Players:GetPlayers()) do CreateESP(p) end
            CleanConnection("ESP_Add")
            Connections.ESP_Add = Players.PlayerAdded:Connect(CreateESP)
            Connections.ESP_Remove = Players.PlayerRemoving:Connect(RemoveESP)
            
            CleanConnection("ESP_Update")
            Connections.ESP_Update = RunService.RenderStepped:Connect(function()
                local myChar = LocalPlayer.Character
                local myHrp = myChar and myChar:FindFirstChild("HumanoidRootPart")
                if not myHrp then return end

                for player, objs in pairs(ESPStorage) do
                    if player.Character and player.Character:FindFirstChild("HumanoidRootPart") then
                        local hum = player.Character:FindFirstChildOfClass("Humanoid")
                        local label = objs[2] and objs[2]:FindFirstChildOfClass("TextLabel")
                        
                        if label and hum then
                            local dist = math.floor((myHrp.Position - player.Character.HumanoidRootPart.Position).Magnitude)
                            local hpPercent = math.floor((hum.Health / hum.MaxHealth) * 100)
                            label.Text = string.format("%s\n[%d M] | HP: %d%%", player.DisplayName, dist, hpPercent)
                        end
                    end
                end
            end)
        else
            CleanConnection("ESP_Add")
            CleanConnection("ESP_Remove")
            CleanConnection("ESP_Update")
            for p, _ in pairs(ESPStorage) do RemoveESP(p) end
        end
    end,
})

