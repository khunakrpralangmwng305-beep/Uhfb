FarmTab:CreateButton({
    Name = "🚀 เริ่มการบินฟาร์ม (Smooth Waypoints)",
    Callback = function()
        if IsTweening then
            Rayfield:Notify({Title = "⚠️ คำเตือน", Content = "กำลังบินอยู่! หากต้องการหยุดให้กดปุ่มยกเลิก", Duration = 2})
            return
        end
        
        IsTweening = true
        task.spawn(function()
            local character = LocalPlayer.Character or LocalPlayer.CharacterAdded:Wait()
            local hrp = character:WaitForChild("HumanoidRootPart", 5)
            
            if not hrp then IsTweening = false return end
            
            for i, targetCFrame in ipairs(waypoints) do
                if not IsTweening then break end -- รองรับการยกเลิก
                
                local distance = (hrp.Position - targetCFrame.Position).Magnitude
                local timeToTravel = math.max(distance / States.FlySpeed, 0.1)
                local tInfo = TweenInfo.new(timeToTravel, Enum.EasingStyle.Linear)
                
                ActiveTween = TweenService:Create(hrp, tInfo, {CFrame = targetCFrame})
                ActiveTween:Play()
                ActiveTween.Completed:Wait()
            end
            
            IsTweening = false
            Rayfield:Notify({Title = "✅ สำเร็จ", Content = "บินครบทุกจุดเรียบร้อยแล้ว!", Duration = 3})
        end)
    end,
})

