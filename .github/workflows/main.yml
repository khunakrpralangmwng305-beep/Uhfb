CombatTab:CreateSection("ตั้งค่าระบบช่วยยิง")

local function IsVisible(targetPart)
    if not States.WallCheck then return true end
    local camera = Workspace.CurrentCamera
    local ray = Ray.new(camera.CFrame.Position, (targetPart.Position - camera.CFrame.Position).Unit * 500)
    local part = Workspace:FindPartOnRayWithIgnoreList(ray, {LocalPlayer.Character, targetPart.Parent})
    return part == nil or part:IsDescendantOf(targetPart.Parent)
end

local function GetClosestHead()
    local camera = Workspace.CurrentCamera
    local closestHead = nil
    local shortestDistance = math.huge
    local mousePos = UserInputService:GetMouseLocation()

    for _, player in pairs(Players:GetPlayers()) do
        if player ~= LocalPlayer and player.Character then
            local head = player.Character:FindFirstChild("Head")
            local humanoid = player.Character:FindFirstChildOfClass("Humanoid")
            
            if head and humanoid and humanoid.Health > 0 and IsVisible(head) then
                local screenPos, onScreen = camera:WorldToViewportPoint(head.Position)
                if onScreen then
                    local distance = (Vector2.new(screenPos.X, screenPos.Y) - mousePos).Magnitude
                    if distance < shortestDistance then
                        shortestDistance = distance
                        closestHead = head
                    end
                end
            end
        end
    end
    return closestHead
end

CombatTab:CreateToggle({
    Name = "🎯 เปิดใช้งาน Camera Lock Head",
    CurrentValue = false,
    Flag = "LockHead",
    Callback = function(Value)
        States.LockHead = Value
        if Value then
            CleanConnection("Aimbot")
            Connections.Aimbot = RunService.RenderStepped:Connect(function()
                if States.LockHead then
                    local targetHead = GetClosestHead()
                    if targetHead then
                        local camera = Workspace.CurrentCamera
                        -- Smooth Lerp กล้องไม่สะบัด
                        local targetCFrame = CFrame.new(camera.CFrame.Position, targetHead.Position)
                        camera.CFrame = camera.CFrame:Lerp(targetCFrame, States.AimbotSmooth)
                    end
                end
            end)
        else
            CleanConnection("Aimbot")
        end
    end,
})

